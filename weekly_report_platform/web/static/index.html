<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>周报同步控制台</title>
    <link rel="stylesheet" href="/static/phase5-app.css?v=20260515-3" />
  </head>
  <body>
    <main class="workspace-shell">
      <header class="workspace-header">
        <p class="eyebrow">Weekly Report</p>
        <h1>周报同步控制台</h1>
      </header>

      <section class="workspace-grid">
        <section class="panel form-panel">
          <form id="task-form">
            <div class="form-row">
              <label class="field">
                <span>开始日期</span>
                <input type="date" name="start_date" />
              </label>
              <label class="field">
                <span>主题关键字</span>
                <input type="text" name="subject_keyword" value="周报" placeholder="默认：周报" />
              </label>
              <label class="field">
                <span>抽取数量</span>
                <input type="number" name="max_emails" min="1" placeholder="不限" />
              </label>
            </div>
            <div class="button-row">
              <button id="submit-button" class="primary-button" type="submit">开始抽取</button>
              <button id="stop-task-button" class="danger-button" type="button">停止当前任务</button>
            </div>
          </form>
          <div class="form-notice">
            <p class="notice-title">注意</p>
            <ul class="notice-list">
              <li>若不填写开始日期，则默认抽取邮箱中全部邮件（暂不建议）</li>
              <li>若不填写抽取数量，则默认抽取符合其他条件的全部邮件内容</li>
              <li>历史邮件默认全部重新处理</li>
            </ul>
          </div>
        </section>

        <section class="panel monitor-panel">
          <div class="monitor-status">
            <div class="monitor-heading">
              <p class="section-tag">任务</p>
              <h2>运行状态</h2>
            </div>
            <div class="status-meta">
              <span class="status-label">状态</span>
              <strong id="task-status-value" class="status-value">未开始</strong>
            </div>
            <div class="status-meta">
              <span class="status-label">任务编号</span>
              <code id="run-id-value" class="run-id" title="-">-</code>
            </div>
            <p id="task-status-note" class="status-note">当前没有运行中的任务</p>
            <p id="message-banner" class="message-banner" aria-live="polite">等待执行</p>
          </div>

          <div class="monitor-divider"></div>

          <div class="monitor-current">
            <p class="section-tag">进度</p>
            <p id="current-empty" class="monitor-empty">当前无正在处理的周报</p>
            <div id="current-info" class="current-info" hidden>
              <div class="current-row">
                <span class="current-label">邮件主题</span>
                <strong id="current-subject" class="current-subject">-</strong>
              </div>
              <div class="current-row">
                <span class="current-label">当前阶段</span>
                <strong id="current-stage" class="current-stage">-</strong>
              </div>
            </div>
          </div>

          <div class="monitor-divider"></div>

          <div class="monitor-summary">
            <p class="section-tag">统计</p>
            <div class="summary-grid">
              <article class="summary-card">
                <span class="summary-label">总邮件</span>
                <strong class="summary-value" data-field="total_emails">0</strong>
              </article>
              <article class="summary-card">
                <span class="summary-label">已处理</span>
                <strong class="summary-value" data-field="processed_emails">0</strong>
              </article>
              <article class="summary-card accent-success">
                <span class="summary-label">成功</span>
                <strong class="summary-value" data-field="synced_count">0</strong>
              </article>
              <article class="summary-card accent-warn">
                <span class="summary-label">跳过</span>
                <strong class="summary-value" data-field="skipped_count">0</strong>
              </article>
              <article class="summary-card accent-fail">
                <span class="summary-label">失败</span>
                <strong class="summary-value" data-field="failed_count">0</strong>
              </article>
            </div>
          </div>

          <div class="monitor-divider"></div>

          <div class="monitor-anomaly">
            <p class="section-tag">异常</p>
            <p id="anomaly-empty" class="monitor-empty">暂无异常内容</p>
            <div id="anomaly-list" class="anomaly-list" hidden>
              <div id="anomaly-failed-section" class="anomaly-section" hidden>
                <h3 class="anomaly-group-heading">失败</h3>
                <ul id="anomaly-failed-list" class="anomaly-group-list"></ul>
              </div>
              <div id="anomaly-skipped-section" class="anomaly-section" hidden>
                <h3 class="anomaly-group-heading">跳过</h3>
                <ul id="anomaly-skipped-list" class="anomaly-group-list"></ul>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="/static/phase5-app.js?v=20260515-3"></script>
  </body>
</html>
